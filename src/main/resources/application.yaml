spring:
  application:
    name: uaiou-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # O schema é definido pelas migrations do Flyway (T-02) — a JPA só confere se bate, nunca gera DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Cache, não fonte de verdade (RF-10.6): um Redis lento não pode segurar a rota de maior volume do
      # sistema. Timeout curto + degradação para o PostgreSQL é preferível a esperar.
      timeout: 500ms
      connect-timeout: 500ms

  jackson:
    # Jackson 3 (usado pelo Spring Boot 4) já serializa java.time.Instant como ISO-8601 UTC por padrão —
    # não existe mais a feature "write-dates-as-timestamps" para desligar (verificado empiricamente).
    time-zone: UTC
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Único lugar onde o prefixo de versão é definido (RF-01.4) — todo @RequestMapping de controller é relativo a ele.
    context-path: /api/v1
  shutdown: graceful

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  minio:
    # "internal" é o host que o BACKEND usa para falar com o MinIO (dentro do docker-compose, o nome do
    # serviço); "public" é o host que o CLIENTE (fora da rede Docker) usa para seguir a URL pré-assinada —
    # sem essa distinção, uma URL assinada com "minio:9000" seria inalcançável por qualquer app externo.
    internal-endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET}
  credits:
    # RF-09.7: TODO(dono) — valor vai mudar; por isso é configuração, nunca literal no código.
    cost-per-order: ${CREDITS_COST_PER_ORDER:1}
  orders:
    # RF-11.11: raio único na v1 (ajuste por região é fase 2) — calibrar contra densidade real.
    eligibility-radius-km: ${ORDERS_ELIGIBILITY_RADIUS_KM:10}
  presence:
    # RF-10.7: idade máxima de uma posição para ela ainda valer como "recente" (elegibilidade, ficar
    # disponível) e TTL da réplica no Redis. Sugestão inicial da task: 5 min.
    freshness: ${PRESENCE_FRESHNESS:PT5M}
