spring:
  application:
    name: uaiou-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # O schema é definido pelas migrations do Flyway (T-02) — a JPA só confere se bate, nunca gera DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Jackson 3 (usado pelo Spring Boot 4) já serializa java.time.Instant como ISO-8601 UTC por padrão —
    # não existe mais a feature "write-dates-as-timestamps" para desligar (verificado empiricamente).
    time-zone: UTC
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Único lugar onde o prefixo de versão é definido (RF-01.4) — todo @RequestMapping de controller é relativo a ele.
    context-path: /api/v1
  shutdown: graceful

logging:
  level:
    root: INFO
