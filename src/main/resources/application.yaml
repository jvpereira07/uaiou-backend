spring:
  application:
    name: uaiou-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # O schema é definido pelas migrations do Flyway (T-02) — a JPA só confere se bate, nunca gera DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Cache, não fonte de verdade (RF-10.6): um Redis lento não pode segurar a rota de maior volume do
      # sistema. Timeout curto + degradação para o PostgreSQL é preferível a esperar.
      timeout: 500ms
      connect-timeout: 500ms

  jackson:
    # Jackson 3 (usado pelo Spring Boot 4) já serializa java.time.Instant como ISO-8601 UTC por padrão —
    # não existe mais a feature "write-dates-as-timestamps" para desligar (verificado empiricamente).
    time-zone: UTC
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Único lugar onde o prefixo de versão é definido (RF-01.4) — todo @RequestMapping de controller é relativo a ele.
    context-path: /api/v1
  shutdown: graceful

logging:
  level:
    root: INFO

app:
  admin-bootstrap:
    # Admin criado no primeiro boot de um banco vazio (nenhuma migration insere dados e o
    # autorregistro recusa ADMIN). Defaults triviais de propósito: um ambiente local sobe sem
    # configuração. Em produção são credenciais publicamente conhecidas — trocar a senha no
    # primeiro acesso faz parte de subir o serviço.
    email: ${ADMIN_DEFAULT_EMAIL:admin}
    password: ${ADMIN_DEFAULT_PASS:admin}
    login: ${ADMIN_DEFAULT_LOGIN:admin}
    nivel: ${ADMIN_DEFAULT_NIVEL:pleno}
  cors:
    # RF-A13.1 — origens que podem chamar a API de dentro de um navegador. Só afeta cliente web
    # (Flutter Web em desenvolvimento e o painel Next.js); Android e iOS não passam por CORS.
    # Explícito por ambiente, NUNCA "*". Em produção, vem da variável com os domínios reais.
    # O Flutter escolhe uma porta aleatória se `flutter run` não receber --web-port: fixe a porta
    # ao rodar, senão a origem muda a cada execução e cai fora desta lista.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:8123,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  push:
    # T-08 — conta de serviço do Firebase. Informe UM dos dois: caminho do JSON (docker-compose) ou
    # o conteúdo do JSON (Railway, onde montar arquivo é incômodo). Ambos VAZIOS é estado válido: o
    # transporte cai no LoggingPushSender e o inbox continua funcionando.
    credentials-path: ${PUSH_PROVIDER_CREDENTIALS_PATH:}
    credentials-json: ${PUSH_PROVIDER_CREDENTIALS_JSON:}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  minio:
    # "internal" é o host que o BACKEND usa para falar com o MinIO (dentro do docker-compose, o nome do
    # serviço); "public" é o host que o CLIENTE (fora da rede Docker) usa para seguir a URL pré-assinada —
    # sem essa distinção, uma URL assinada com "minio:9000" seria inalcançável por qualquer app externo.
    internal-endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET}
  credits:
    # RF-09.7: TODO(dono) — valor vai mudar; por isso é configuração, nunca literal no código.
    cost-per-order: ${CREDITS_COST_PER_ORDER:1}
  delivery:
    # Chave separada do banco (RN-08.3): comprometer o banco sozinho não entrega os códigos ativos.
    cipher-key: ${DELIVERY_CODE_CIPHER_KEY}
    # RN-08.7 — política fina de expiração é de T-15; nasce configurável para não virar literal.
    code-ttl: ${DELIVERY_CODE_TTL:PT24H}
    # RN-08.1: raio dentro do qual a finalização é permitida.
    geofence-radius-meters: ${DELIVERY_GEOFENCE_RADIUS_METERS:150}
    # RF-15.8: tentativas de código antes do bloqueio (força bruta em 4-6 dígitos).
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:3}
    # RF-15.7: divergência entre a posição do corpo e a última reportada que ainda não marca revisão.
    position-divergence-tolerance-meters: ${DELIVERY_POSITION_DIVERGENCE_TOLERANCE_METERS:300}
    # RF-16.3/RF-16.5: prazo do degrau 2 até a atribuição de falha.
    contingency-deadline: ${DELIVERY_CONTINGENCY_DEADLINE:PT30M}
    # RF-16.2: reenvios do degrau 1 antes de escalar ao degrau 2.
    sms-resend-limit: ${DELIVERY_SMS_RESEND_LIMIT:2}
    # RF-16.5: pontos da penalidade objetiva ao estabelecimento por contingência atribuída a ele.
    penalty-points: ${DELIVERY_PENALTY_POINTS:10}
    # RF-17.6: janela de contestação até a consolidação automática.
    contestable-window: ${DELIVERY_CONTESTABLE_WINDOW:P1D}
  pickup:
    # T-26 — valores provisórios (D4, D8); calibrar com dado de produção.
    # RF-26.2: raio da loja (maior que o geofence de entrega: galeria, shopping, rua sem vaga).
    radius-meters: ${PICKUP_RADIUS_METERS:150}
    # RF-26.2: leituras consecutivas no raio antes de registrar a chegada.
    required-readings: ${PICKUP_REQUIRED_READINGS:2}
    # RF-26.10: espera desde a chegada até o entregador poder pedir novo aviso, e intervalo entre avisos.
    reminder-after: ${PICKUP_REMINDER_AFTER:PT5M}
    reminder-min-interval: ${PICKUP_REMINDER_MIN_INTERVAL:PT2M}
    # RF-26.17/RF-26.18: fração do frete final devida ao entregador quando a loja cancela após a chegada.
    arrived-cancellation-fee-rate: ${PICKUP_ARRIVED_CANCELLATION_FEE_RATE:0.50}
    # RF-26.30: espera na loja a partir da qual desistir por atraso não penaliza.
    withdrawal-pickup-delay-tolerance: ${WITHDRAWAL_PICKUP_DELAY_TOLERANCE:PT15M}
  orders:
    # RF-11.11: raio único na v1 (ajuste por região é fase 2) — calibrar contra densidade real.
    eligibility-radius-km: ${ORDERS_ELIGIBILITY_RADIUS_KM:10}
  geocoding:
    # Salto coordenada → CEP dos seletores de endereço no mapa (app e web). Mesma conta Geoapify
    # de `routing`: por padrão herda ROUTING_API_KEY, porque duplicar a variável convidaria alguém
    # a girar uma chave e esquecer a outra. GEOCODING_API_KEY existe para separar as cotas depois.
    # Chave VAZIA desliga o recurso, como em rotas — o formulário pede preenchimento à mão.
    api-key: ${GEOCODING_API_KEY:${ROUTING_API_KEY:}}
    base-url: ${GEOCODING_BASE_URL:https://api.geoapify.com}
    language: ${GEOCODING_LANGUAGE:pt}
    # Curto pelo mesmo motivo de RNF-25.1: alguém está com um formulário aberto esperando.
    timeout: ${GEOCODING_TIMEOUT:PT3S}
  routing:
    # T-25 — rotas por via. Chave VAZIA é estado válido: o recurso desliga e a aplicação sobe igual
    # (critério de aceite 6). Nunca versionar a chave: chave de rota no repositório é chave a revogar.
    api-key: ${ROUTING_API_KEY:}
    base-url: ${ROUTING_BASE_URL:https://api.geoapify.com}
    # RF-25.2: o veículo real da praça.
    mode: ${ROUTING_MODE:motorcycle}
    language: ${ROUTING_LANGUAGE:pt}
    # RNF-25.1: curto de propósito — a rota nunca pode segurar a resposta do entregador.
    timeout: ${ROUTING_TIMEOUT:PT3S}
    # RF-25.9: a perna estabelecimento → destino não muda enquanto o pedido existir; o TTL só evita
    # que a entrada viva para sempre no Redis.
    delivery-cache-ttl: ${ROUTING_DELIVERY_CACHE_TTL:P7D}
    # RF-25.9: a perna que varia com a posição de quem pergunta. Calibrar com consumo real (RF-25.11).
    pickup-cache-ttl: ${ROUTING_PICKUP_CACHE_TTL:PT5M}
    # Casas decimais no arredondamento da posição do entregador na chave de cache (3 ≈ 110 m).
    pickup-coordinate-scale: ${ROUTING_PICKUP_COORDINATE_SCALE:3}
    # RNF-25.2: atribuição exigida pela licença do plano gratuito — obrigação, não escolha de layout.
    attribution: ${ROUTING_ATTRIBUTION:Powered by Geoapify · © OpenStreetMap contributors}
  map-tiles:
    # Mapa vetorial da navegação, servido por este backend com cache no MinIO. Mesma conta
    # Geoapify de `routing`; chave VAZIA desliga o recurso e o app usa o mapa raster de reserva.
    api-key: ${MAP_TILES_API_KEY:${ROUTING_API_KEY:}}
    base-url: ${MAP_TILES_BASE_URL:https://maps.geoapify.com}
    light-style: ${MAP_TILES_LIGHT_STYLE:maptiler-3d}
    dark-style: ${MAP_TILES_DARK_STYLE:dark-matter-yellow-roads}
    timeout: ${MAP_TILES_TIMEOUT:PT5S}
    # Idade a partir da qual um recurso guardado é buscado de novo no provedor.
    cache-ttl: ${MAP_TILES_CACHE_TTL:P30D}
    # Base absoluta da API vista pelo app. OBRIGATÓRIA atrás de proxy TLS (Railway): sem ela as URLs
    # do estilo saem com o esquema/host internos. Vazia deriva da requisição (desenvolvimento).
    public-base-url: ${MAP_TILES_PUBLIC_BASE_URL:}
    # Assina o token diário das URLs de tile. Herda o segredo do JWT; separe para girar um sem o outro.
    signing-secret: ${MAP_TILES_SIGNING_SECRET:${JWT_SECRET}}
    attribution: ${MAP_TILES_ATTRIBUTION:Powered by Geoapify · © OpenMapTiles · © OpenStreetMap contributors}
  presence:
    # RF-10.7: idade máxima de uma posição para ela ainda valer como "recente" (elegibilidade, ficar
    # disponível) e TTL da réplica no Redis. Sugestão inicial da task: 5 min.
    freshness: ${PRESENCE_FRESHNESS:PT5M}
  reviews:
    # RF-19: mesmo prazo do risco documentado na task — alinhado à janela de contestação (T-17) para
    # os dois ciclos fecharem juntos.
    window: ${REVIEWS_WINDOW:P1D}
    comment-max-length: ${REVIEWS_COMMENT_MAX_LENGTH:500}
  score:
    # RF-20.10: pesos versionados — mudar o valor aqui é uma nova versão, registrada no componente.
    weights-version: ${SCORE_WEIGHTS_VERSION:v1}
    # RF-19.6: avaliação automática (padrão positivo) pesa menos que uma opinião real.
    inactive-review-weight: ${SCORE_INACTIVE_REVIEW_WEIGHT:0.3}
