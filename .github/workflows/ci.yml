name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pipeline vermelha bloqueia merge (RF-01.15) — configurado como required status check nas regras de proteção
# da branch main no GitHub (fora do escopo deste arquivo).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # RNF-01.2: CI completa em até 10 minutos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Instalar dependências
        run: ./mvnw -B -q dependency:go-offline

      - name: Formatação (Spotless)
        run: ./mvnw -B spotless:check

      - name: Compilar
        run: ./mvnw -B compile test-compile

      - name: Testes unitários
        run: ./mvnw -B test

      - name: Testes de integração (Testcontainers — Docker já vem pronto nos runners hospedados)
        run: ./mvnw -B failsafe:integration-test failsafe:verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
